<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff6fa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Daily: Emily / Jaimie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a bright desk of four candy-colored cards; each opens a bottom sheet. Single committed bright look. */
:root {
  color-scheme: light;
  --bg: #fff6fa;
  --ink: #2b1240;
  --ink-soft: #6a5578;
  --pink: #ff8ac0;
  --pink-deep: #e2378a;
  --rose: #f43f5e;
  --sun: #ffd84d;
  --tang: #ff9d5c;
  --mint: #7fe0c0;
  --sky: #8ec5ff;
  --paper: #ffffff;
  --line: #2b1240;
  --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 22px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  background-color: var(--bg);
  background-image: radial-gradient(var(--pink) 1.4px, transparent 1.6px);
  background-size: 22px 22px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); align-items: end; gap: 12px; padding-top: 8px; }
.htext { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-bottom: 6px; }
.us { position: relative; min-width: 0; padding-top: 64px; }
.us img { display: block; width: 100%; height: auto; transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
  animation: lean 4s ease-in-out infinite; }
@keyframes lean { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-1.5deg) translateY(-2px); } }
.say-bubble {
  position: absolute; top: 0; left: -8%; max-width: 86%; z-index: 2; cursor: pointer;
  font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.15; text-align: left; color: var(--ink);
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 9px 13px; box-shadow: 3px 3px 0 var(--rose);
}
.say-bubble::after { content: ""; position: absolute; left: 22px; bottom: -11px; width: 16px; height: 16px; background: var(--paper); border-right: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line); transform: rotate(45deg) skew(10deg, 10deg); }
.say-bubble.swap { animation: bubble .45s cubic-bezier(.2, .9, .3, 1.5); }
@keyframes bubble { 0% { transform: scale(.6) rotate(-6deg); } 100% { transform: none; } }
.say-bubble:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
@media (max-width: 600px) {
  header { grid-template-columns: 1fr; }
  .us { order: -1; width: min(210px, 58%); margin-left: auto; margin-bottom: -6px; padding-top: 58px; }
  .say-bubble { left: -62%; max-width: 118%; font-size: 14px; }
}
.kicker { font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--pink-deep); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(38px, 9vw, 72px); line-height: .95; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1 .slash { color: var(--pink-deep); display: inline-block; transform: rotate(8deg); margin: 0 .06em; animation: wiggle 3.2s ease-in-out infinite; }
h1 .n { background: var(--paper); border: 2.5px solid var(--line); border-radius: 14px; padding: 0 .14em; box-shadow: 4px 4px 0 var(--line); display: inline-block; }
.nw { white-space: nowrap; }
.sub { color: var(--ink-soft); font-weight: 500; }
@keyframes wiggle { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-6deg) scale(1.08); } }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

.card {
  position: relative; border: 2.5px solid var(--line); border-radius: var(--r); box-shadow: 6px 6px 0 var(--line);
  padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px; text-align: left; font: inherit; color: var(--ink);
  min-width: 0; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  animation: rise .5s cubic-bezier(.2, .9, .3, 1.3) both;
}
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; } .card:nth-child(4) { animation-delay: .18s; }
@keyframes rise { from { transform: translateY(18px) rotate(-1deg); } to { transform: none; } }
.card:hover { transform: translate(-2px, -2px) rotate(-.4deg); box-shadow: 8px 8px 0 var(--line); }
.card:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--line); }
.card:focus-visible { outline: 3px solid var(--sky); outline-offset: 4px; }
.c-house { background: var(--pink); } .c-tok { background: var(--sun); } .c-kids { background: var(--mint); } .c-hol { background: var(--tang); }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4.4vw, 32px); line-height: 1.02; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 3px 10px; }
.teaser { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 500; min-height: 3.2em; }
.teaser b { font-family: var(--font-display); font-weight: 700; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.open { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 700; }

/* Countdown ticker */
.ticker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tick { background: var(--paper); border: 2.5px solid var(--line); border-radius: 14px; box-shadow: 3px 3px 0 var(--line); padding: 8px 4px 6px; text-align: center; min-width: 0; }
.tick b { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 7vw, 40px); line-height: 1; font-variant-numeric: tabular-nums; }
.tick span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tick.pop b { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--pink-deep); } 100% { transform: scale(1); } }
.holname { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.05; }
.holwhen { font-weight: 600; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(43, 18, 64, .45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 90%; overflow-y: auto; background: var(--bg);
  border-top: 2.5px solid var(--line); border-radius: 26px 26px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 0; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  animation: up .32s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes up { from { transform: translateY(60px); } to { transform: none; } }
.sheet-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { position: sticky; top: 0; background: var(--bg); z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-block: 18px 10px; }
.sheet-head h3 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1; margin: 0; text-wrap: balance; }
.stamp { font-size: 13px; color: var(--ink-soft); font-weight: 600; margin-top: 6px; }
.close { flex: none; font: inherit; font-weight: 800; font-size: 20px; line-height: 1; width: 42px; height: 42px; border-radius: 50%; background: var(--paper); color: var(--ink); border: 2.5px solid var(--line); box-shadow: 3px 3px 0 var(--line); cursor: pointer; }
.close:focus-visible, .btn:focus-visible, .take-btn:focus-visible, .linkish:focus-visible, .vote:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
#sheet-body { display: flex; flex-direction: column; gap: 16px; }

.item { background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 4px 4px 0 var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; animation: rise .45s cubic-bezier(.2, .9, .3, 1.3) both; }
.item h4 { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.1; margin: 0; text-wrap: balance; }
.item p { margin: 0; max-width: 62ch; }
.item a.src-link { color: var(--pink-deep); font-weight: 700; text-underline-offset: 3px; }
.price { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 700; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--bg); font-variant-numeric: tabular-nums; }
.chip.town { background: var(--pink); }
.say { font-style: italic; }
.src { font-size: 13px; color: var(--ink-soft); }
.houseRow { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.archived { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--sun); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.pic { color: var(--ink); text-decoration: none; display: block; position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 2.5px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--pink); }
.pic img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
.pic:hover img { transform: scale(1.04); }
.pic .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: 18px; background: repeating-linear-gradient(-45deg, var(--pink) 0 18px, #ff9fcb 18px 36px); }
.pic .ph svg { width: 64px; height: 64px; }

/* Jaimie's take */
.take-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 4px; }
.take-btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--ink);
  background: var(--sun); border: 2.5px solid var(--line); border-radius: 999px; padding: 9px 18px;
  box-shadow: 4px 4px 0 var(--rose); transition: transform .12s ease, box-shadow .12s ease;
}
.take-btn:hover { transform: translate(-1px, -1px) rotate(-1deg); box-shadow: 6px 6px 0 var(--rose); }
.take-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--rose); }
.linkish { font: inherit; font-size: 14px; font-weight: 700; color: var(--ink-soft); background: none; border: 0; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.take {
  position: relative; background: #ffe3ef; border: 2.5px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 12px 14px;
  box-shadow: 3px 3px 0 var(--rose); animation: rise .4s cubic-bezier(.2, .9, .3, 1.4) both;
}
.take .who { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .02em; color: var(--pink-deep); }
.take p { white-space: pre-wrap; }

/* Holiday sheet */
.hol-hero { background: var(--tang); border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 4px 4px 0 var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.blk { background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 4px 4px 0 var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; animation: rise .45s cubic-bezier(.2, .9, .3, 1.3) both; }
.blk h4 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.blk ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.vs { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.vote { font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.1; color: var(--ink); background: var(--bg); border: 2.5px solid var(--line); border-radius: 16px; padding: 14px 10px; cursor: pointer; box-shadow: 3px 3px 0 var(--line); transition: transform .12s ease, background .2s ease; min-width: 0; }
.vote[aria-pressed="true"] { background: var(--sun); transform: rotate(-2deg) scale(1.03); box-shadow: 4px 4px 0 var(--rose); }
.vote-note { font-size: 14px; font-weight: 600; color: var(--ink-soft); min-height: 1.4em; }
.bubble { background: #ffe3ef; border: 2.5px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 12px 14px; font-weight: 500; }
.next-list { display: flex; flex-wrap: wrap; gap: 6px; }

/* Take modal */
.modal-scrim { position: fixed; inset: 0; background: rgba(43, 18, 64, .55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { width: min(520px, 100%); background: var(--bg); border: 2.5px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--rose); padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: rise .3s cubic-bezier(.2, .9, .3, 1.3) both; }
.modal h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.modal label { font-weight: 700; font-size: 14px; }
.modal textarea { font: inherit; width: 100%; min-height: 140px; padding: 12px; border: 2.5px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); resize: vertical; }
.modal textarea:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.modal .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.modal .hint { font-size: 13px; color: var(--ink-soft); margin: 0; }
.btn { font: inherit; font-weight: 800; cursor: pointer; border: 2.5px solid var(--line); border-radius: 999px; padding: 9px 18px; background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--line); }
.btn.primary { background: var(--pink); box-shadow: 3px 3px 0 var(--rose); }
.btn.danger { margin-right: auto; background: none; box-shadow: none; border-color: transparent; text-decoration: underline; color: var(--ink-soft); padding-inline: 4px; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.sig { text-align: center; font-family: var(--font-display); font-weight: 700; color: var(--ink-soft); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htext">
      <span class="kicker" id="today">today</span>
      <h1><span class="n">Daily:</span> <span class="nw">Emily<span class="slash">/</span>Jaimie</span></h1>
      <span class="sub">our 1:1 without our 1:1</span>
    </div>
    <div class="us">
      <button class="say-bubble" id="say" type="button" aria-live="polite">hi!!</button>
      <img src="us.webp" alt="Jaimie and Emily" width="554" height="498">
    </div>
  </header>

  <main class="grid">
    <button class="card c-house" id="card-houses" type="button" aria-haspopup="dialog">
      <span class="tag">latest listings in westchester county</span>
      <h2>Wait, I need to show you this house</h2>
      <div class="teaser" id="t-houses">Pulling listings…</div>
      <div class="foot"><span id="s-houses"></span><span class="open">open ↗</span></div>
    </button>

    <button class="card c-tok" id="card-tiktok" type="button" aria-haspopup="dialog">
      <span class="tag">stay plugged in</span>
      <h2>omg have you seen what's happening on TikTok??</h2>
      <div class="teaser" id="t-tiktok">Pulling the tea…</div>
      <div class="foot"><span id="s-tiktok"></span><span class="open">open ↗</span></div>
    </button>

    <button class="card c-kids" id="card-coolkids" type="button" aria-haspopup="dialog">
      <span class="tag">millennial guide to whats up with genz</span>
      <h2>What are the cool kids doing?</h2>
      <div class="teaser" id="t-coolkids">Asking the youths…</div>
      <div class="foot"><span id="s-coolkids"></span><span class="open">open ↗</span></div>
    </button>

    <button class="card c-hol" id="card-holiday" type="button" aria-haspopup="dialog">
      <span class="tag">when's the next jewish holiday</span>
      <div class="ticker" aria-live="off">
        <div class="tick"><b id="cd-d">–</b><span>days</span></div>
        <div class="tick"><b id="cd-h">–</b><span>hrs</span></div>
        <div class="tick"><b id="cd-m">–</b><span>min</span></div>
        <div class="tick" id="tick-s"><b id="cd-s">–</b><span>sec</span></div>
      </div>
      <div class="holname" id="h-name"></div>
      <div class="foot"><span class="holwhen" id="h-when"></span><span class="open">the menu ↗</span></div>
    </button>
  </main>

  <p class="sig">xo, jaimie</p>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <div><h3 id="sheet-title"></h3><div class="stamp" id="sheet-stamp"></div></div>
      <button class="close" id="close" type="button" aria-label="Close">×</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="modal-scrim" id="take-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="take-title">
    <h3 id="take-title">Jaimie's take</h3>
    <p class="hint" id="take-about"></p>
    <label for="take-text">Paste or type her verdict</label>
    <textarea id="take-text" placeholder="omg yes. buy it."></textarea>
    <p class="hint">It saves on this phone and stays on this card, even after the feed refreshes.</p>
    <div class="row">
      <button class="btn danger" id="take-remove" type="button">Remove take</button>
      <button class="btn" id="take-cancel" type="button">Cancel</button>
      <button class="btn primary" id="take-save" type="button">Save take</button>
    </div>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const EMAIL = "jjmeyers914@gmail.com";
const TITLES = { houses: "Wait, I need to show you this house", tiktok: "omg have you seen what's happening on TikTok??", coolkids: "What are the cool kids doing?" };
const state = { houses: { items: [] }, tiktok: { items: [] }, coolkids: { items: [] } };
let openKey = null;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const money = (n) => n >= 1e6 ? "$" + (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M" : "$" + Math.round(n / 1e3) + "K";
const moneyFull = (n) => "$" + Number(n).toLocaleString("en-US");
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- storage (per phone) ---------- */
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }
let takes = load("dej-takes", {});
let votes = load("dej-votes", {});

/* ---------- dates ---------- */
function nyDay(d) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d).map(x => [x.type, x.value]));
  return p.year + "-" + p.month + "-" + p.day;
}
function stamp(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const today = nyDay(new Date()), that = nyDay(d), yday = nyDay(new Date(Date.now() - 864e5));
  const when = that === today ? "today" : that === yday ? "yesterday" : d.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" }).toLowerCase();
  const t = d.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }).toLowerCase().replace(":00", "");
  return "fresh " + when + ", " + t;
}

/* ---------- confetti ---------- */
const cv = $("confetti"), ctx = cv.getContext("2d");
let bits = [], raf = null;

  return live.concat(kept);
}

const LAT = 40.7128, LNG = -74.006;
function sunsetUTC(y, m, d) {

$("today").textContent = new Date().toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "long", month: "long", day: "numeric" });
async function loadFeeds() {
  try {
    const r = await fetch("feeds.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    for (const k of ["houses", "tiktok", "coolkids"]) if (data[k] && Array.isArray(data[k].items)) state[k] = { updatedAt: data[k].updatedAt, items: data[k].items };
  } catch (e) { /* keep what we have */ }
  renderTeasers();
  if (openKey && openKey !== "holiday") renderSheet(openKey);
}
renderTeasers(); tick(); setInterval(tick, 1000); loadFeeds();

function nextSay() {

  b.textContent = cur.t; b.dataset.k = cur.k;
  if (!reduced) { b.classList.remove("swap"); void b.offsetWidth; b.classList.add("swap"); }
  sayIdx++;
}
